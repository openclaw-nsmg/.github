# ─────────────────────────────────────────────────────────────────────────────
# Security Analysis — Multi-Scanner CI Gate
# ─────────────────────────────────────────────────────────────────────────────
# Combines four security scanners, each gated independently:
#   - Semgrep (semgrep/semgrep-action)         — SAST
#   - Trivy (aquasecurity/trivy-action)        — filesystem / dep CVE scan
#   - Gitleaks (gitleaks/gitleaks-action)      — secret detection
#   - Zizmor (zizmorcore/zizmor-action)        — GitHub Actions security lint
#
# CodeQL is handled by GitHub's Default Setup (enforced at enterprise level).
# Advanced Configuration was removed to resolve the conflict:
#   "CodeQL analyses from advanced configurations cannot be processed
#    when the default setup is enabled"
#
# All actions are publisher-official; zero self-rolled logic.
#
# Results upload to GitHub code scanning (SARIF) when available.
#
# Managed by: openclaw-nsmg/governance-central. Do not edit locally.
# ─────────────────────────────────────────────────────────────────────────────
name: Security Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'   # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.121.0
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # ISSUE-226: wrap network-dependent scan with retry to absorb registry
      # rate-limits / rule-fetch timeouts. Step-level fix complements the
      # job-level safety net in ci-auto-retry.yml.
      - name: Run Semgrep (with retry)
        id: semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e  # v3.0.0
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          # nick-fields/retry triggers on non-zero exit. Semgrep returns
          # non-zero on findings — we want to retry on network errors only.
          # Exit 0 only if SARIF was generated (findings or clean scan);
          # propagate failure if SARIF is missing (network/auth error).
          command: |
            semgrep ci --sarif --output=semgrep.sarif; rc=$?
            if [ -f semgrep.sarif ]; then exit 0; fi
            exit $rc
      - name: Detect Semgrep SARIF
        id: semgrep-sarif-check
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Semgrep SARIF
        if: steps.semgrep-sarif-check.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b  # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy filesystem & dep scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pinned at job level for Dependabot version-update visibility.
      # Bump via Dependabot custom config or manual PR.
      TRIVY_VERSION: "0.71.0"
      TRIVY_SHA256: "30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # ISSUE-226: trivy-action pulls a vulnerability DB on every run, which
      # frequently rate-limits or 5xx's. Replace the action call with a direct
      # CLI invocation wrapped in nick-fields/retry to absorb transient
      # registry failures without failing the workflow.
      - name: Install Trivy
        run: |
          set -euo pipefail
          ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ARCHIVE}" \
            -o trivy.tar.gz
          # SHA256 verification (supply-chain hardening)
          if [ -n "$TRIVY_SHA256" ]; then
            echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          else
            echo "::warning::TRIVY_SHA256 not pinned — skipping integrity check. Pin after first successful run."
          fi
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy trivy.tar.gz
          trivy --version
      - name: Run Trivy filesystem scan (with retry)
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e  # v3.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          # --exit-code 0: always exit 0 on scan completion (findings are
          # informational via SARIF upload). Non-zero only on DB download or
          # scan engine errors — which is exactly what we want to retry.
          command: |
            trivy fs \
              --format sarif \
              --output trivy.sarif \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 0 \
              .
      - name: Check Trivy SARIF exists
        id: trivy-sarif-check
        if: always()
        run: |
          if [ -f trivy.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Trivy SARIF
        if: always() && steps.trivy-sarif-check.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@78ed0c7291d93e40c51b085850dc669a4c3ab73b  # v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # Detect optional repo-level config before invoking the action so that
      # downstream variable expansion is array-based (avoids SC2086 / unquoted
      # expansion when no config file is present).
      - name: Detect gitleaks config
        id: gl-config
        shell: bash
        run: |
          set -euo pipefail
          config_args=()
          if [[ -f ".gitleaks.toml" ]]; then
            config_args+=("--config" ".gitleaks.toml")
            echo "config_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "config_present=false" >> "$GITHUB_OUTPUT"
          fi
          # Persist as an env-var string so the next step picks it up via env.
          # Quoting the array expansion is intentional: protects against word
          # splitting if paths ever contain spaces (shellcheck SC2086).
          printf 'GITLEAKS_CLI_ARGS=%s\n' "${config_args[*]}" >> "$GITHUB_ENV"

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for organization repos. When the org
          # secret is unset, the action exits with an error — register a free
          # license at https://gitleaks.io and add the secret at the org level.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Forwards to gitleaks-action's underlying CLI when set.
          GITLEAKS_CONFIG: ${{ steps.gl-config.outputs.config_present == 'true' && '.gitleaks.toml' || '' }}

  # ── Zizmor — GitHub Actions Security Lint ───────────────────────────────────
  # Catches CI/CD security footguns: template-injection sinks, over-broad
  # permissions, unpinned actions, artifact-poisoning vectors, and dangerous
  # trigger combinations. Pure exit-code gate (no SARIF upload).
  # Merged from standalone zizmor.yml per REPORT-310 / Issue #415.
  zizmor:
    name: Zizmor scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false

  # ── Aggregate gate (community standard) ────────────────────────────────────
  # Single required status check `Security Summary` that turns the four
  # independent scanners into one gate (REPORT-304 §5-F + REPORT-310 §Issue
  # #415). Uses re-actors/alls-green — the same action used by ci.yml /
  # ci-node.yml. Pinned by SHA per repo supply-chain policy (not @release/v1).
  #
  # allowed-skips:
  #   - trivy:   informational fs/dep scan; only meaningful for repos shipping a
  #              container/lockfile, so a skip must not fail the gate (per the
  #              Decision comment rationale).
  #   - semgrep: skips on Dependabot-authored events (see its job-level
  #              `if: github.actor != 'dependabot[bot]'`); a correct skip there
  #              must not block the Dependabot PR.
  # gitleaks and zizmor are intentionally NOT skippable — always gate.
  security-summary:
    name: Security Summary
    needs: [semgrep, trivy, gitleaks, zizmor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the security scanners succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: semgrep,trivy
