# ─────────────────────────────────────────────────────────────────────────────
# Security Review — Anthropic claude-code-security-review
# ─────────────────────────────────────────────────────────────────────────────
# Action: anthropics/claude-code-security-review@0c6a49f (pinned)
# Reference: https://github.com/anthropics/claude-code-security-review
#
# Runs Claude-powered security review against PR diffs and posts inline
# findings as PR review comments. Zero self-rolled logic; the action handles
# the entire pipeline (diff extraction → analysis → comment posting).
#
# Auth: ANTHROPIC_API_KEY (org/repo secret)
#
# Managed by: openclaw-nsmg/governance-central. Do not edit locally.
# ─────────────────────────────────────────────────────────────────────────────
name: Security Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    name: Claude Security Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Claude security review
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main 2026-05-17
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          # Tighten/loosen by editing locally per repo:
          # include-paths: 'src/**,api/**'
          # exclude-paths: 'tests/**,docs/**'
